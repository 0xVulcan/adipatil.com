<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="description" content="View or download the resume of Aditya Patil, a cybersecurity professional specializing in offensive security and vulnerability management." />
    <link rel="canonical" href="https://adipatil.com/resume/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Resume | Aditya Patil</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #0b0f14;
        color: #f6f7f2;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        background-color: #0b0f14;
        background-image:
          linear-gradient(rgba(92, 122, 168, .1) 1px, transparent 1px),
          linear-gradient(90deg, rgba(92, 122, 168, .1) 1px, transparent 1px);
        background-size: 52px 52px;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 16px;
        padding: 18px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        width: min(1180px, 100%);
        margin: 0 auto;
        padding: 10px 12px 10px 20px;
        border: 1px solid rgba(246, 247, 242, .22);
        border-radius: 999px;
        background: rgba(11, 15, 20, .74);
        backdrop-filter: blur(16px);
      }

      .title {
        margin: 0;
        font-size: clamp(1rem, 2vw, 1.25rem);
        font-weight: 800;
      }

      .actions { display: flex; gap: 8px; }

      a {
        color: inherit;
        text-decoration: none;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 18px;
        border: 1px solid rgba(246, 247, 242, .32);
        border-radius: 999px;
        font-size: .88rem;
        font-weight: 750;
        transition: background-color .2s ease, color .2s ease, border-color .2s ease;
      }

      .button.primary {
        border-color: #c7ff38;
        background: #c7ff38;
        color: #0b0f14;
      }

      .button:hover, .button:focus-visible {
        border-color: #c7ff38;
        outline: none;
      }

      .viewer {
        width: min(1180px, 100%);
        min-height: calc(100vh - 96px);
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid rgba(246, 247, 242, .22);
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 22px 70px rgba(0, 0, 0, .34);
      }

      object { width: 100%; height: 100%; min-height: calc(100vh - 98px); display: block; }

      .fallback { padding: 28px; color: #111; }

      ::selection { background: #c7ff38; color: #071018; }

      @media (max-width: 640px) {
        .shell { padding: 10px; }
        .toolbar { align-items: flex-start; border-radius: 22px; padding: 14px; }
        .actions { flex-direction: column; }
        .button { min-height: 38px; padding-inline: 14px; }
        .viewer { min-height: calc(100vh - 112px); border-radius: 16px; }
        object { min-height: calc(100vh - 114px); }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="toolbar">
        <h1 class="title">Aditya Patil · Resume</h1>
        <nav class="actions" aria-label="Resume actions">
          <a class="button" href="/">Home</a>
          <a class="button primary" href="./Aditya-Patil-Resume.pdf" download="Aditya-Patil-Resume.pdf">Download</a>
        </nav>
      </header>
      <section class="viewer" aria-label="Aditya Patil resume">
        <object data="./Aditya-Patil-Resume.pdf#view=FitH" type="application/pdf" aria-label="Aditya Patil resume PDF">
          <p class="fallback">Your browser cannot display this PDF. <a href="./Aditya-Patil-Resume.pdf">Open the resume</a>.</p>
        </object>
      </section>
    </main>
  </body>
</html>
