<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#03050a" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Aditya Patil</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        background: #03050a;
        color: #f7f8ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #03050a;
      }

      a {
        color: inherit;
      }

      button {
        color: inherit;
        font: inherit;
      }

      .voidPage {
        position: relative;
        isolation: isolate;
        width: 100%;
        min-height: 100svh;
        overflow: hidden;
      }

      .voidBackground,
      .voidShade,
      .voidScanlines {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .voidBackground {
        z-index: -3;
        object-fit: cover;
        object-position: center;
        background: #03050a url("/lost-in-space-404.webp") center / cover no-repeat;
        transform: scale(1.03);
        animation: spaceDrift 14s ease-in-out infinite alternate;
        transition: opacity 0.7s ease, filter 0.7s ease;
      }

      .voidBackground.isChanging {
        opacity: 0.4;
        filter: blur(3px);
      }

      .voidShade {
        z-index: -2;
        background:
          linear-gradient(90deg, rgba(2, 4, 9, 0.92), rgba(2, 4, 9, 0.56) 52%, rgba(2, 4, 9, 0.18)),
          linear-gradient(180deg, rgba(2, 4, 9, 0.24), rgba(2, 4, 9, 0.86));
      }

      .voidScanlines {
        z-index: -1;
        opacity: 0.16;
        background-image: repeating-linear-gradient(0deg, transparent 0 3px, rgba(118, 232, 255, 0.12) 4px);
        pointer-events: none;
      }

      .voidHeader,
      .voidFooter {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: clamp(20px, 3vw, 42px);
      }

      .voidHeader {
        top: 0;
      }

      .voidFooter {
        bottom: 0;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: flex-end;
      }

      .voidBrand,
      .voidKicker,
      .voidCountdown span {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .voidBrand,
      .voidKicker,
      .voidCountdown strong {
        color: #c9ff37;
      }

      .voidCode,
      .voidStatus,
      .voidCountdown span {
        color: rgba(247, 248, 255, 0.68);
      }

      .voidBrand {
        font-size: 1rem;
        text-decoration: none;
      }

      .voidHeaderActions,
      .voidMessageActions,
      .voidFooterActions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .voidFooterActions {
        justify-content: flex-start;
        margin-top: 12px;
      }

      .voidFooterCenter {
        display: grid;
        justify-items: center;
        gap: 14px;
      }

      .voidCode {
        justify-self: center;
        color: #f7f8ff;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(1.35rem, 2.4vw, 2.2rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        text-transform: uppercase;
      }

      .voidMessage {
        position: absolute;
        top: 50%;
        left: clamp(20px, 7vw, 110px);
        width: min(760px, calc(100% - 40px));
        transform: translateY(-50%);
      }

      .voidKicker {
        margin: 0 0 20px;
      }

      .voidMessage h1 {
        max-width: 760px;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(2.8rem, 7vw, 7rem);
        font-weight: 700;
        letter-spacing: -0.06em;
        line-height: 0.98;
        text-wrap: balance;
      }

      .voidTyped::after {
        content: "_";
        color: #76e8ff;
        animation: textCursor 0.7s steps(1, end) infinite;
      }

      .voidStatus {
        margin: 24px 0 0;
        font-size: 0.82rem;
      }

      .voidMessageActions {
        margin-top: 22px;
        flex-wrap: wrap;
      }

      .voidControl,
      .voidHome {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid rgba(247, 248, 255, 0.34);
        border-radius: 999px;
        background: rgba(3, 5, 10, 0.56);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
        backdrop-filter: blur(10px);
        transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
      }

      .voidControl {
        cursor: pointer;
      }

      .voidControlPrimary {
        border-color: #c9ff37;
        color: #071018;
        background: #c9ff37;
      }

      .voidControl svg,
      .voidHome svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .voidControl:hover,
      .voidControl:focus-visible,
      .voidHome:hover,
      .voidHome:focus-visible {
        border-color: #c9ff37;
        color: #c9ff37;
        transform: translateY(-2px);
      }

      .voidControlPrimary:hover,
      .voidControlPrimary:focus-visible {
        color: #071018;
        background: #d5ff62;
      }

      .voidControl:disabled {
        cursor: default;
        opacity: 0.78;
        transform: none;
      }

      .voidMusicBars {
        display: inline-flex;
        align-items: end;
        gap: 2px;
        height: 12px;
      }

      .voidMusicBars i {
        width: 2px;
        height: 4px;
        background: currentColor;
      }

      .voidControl.isPlaying .voidMusicBars i {
        animation: musicBar 0.7s ease-in-out infinite alternate;
      }

      .voidControl.isPlaying .voidMusicBars i:nth-child(2) {
        animation-delay: -0.35s;
      }

      .voidControl.isPlaying .voidMusicBars i:nth-child(3) {
        animation-delay: -0.18s;
      }

      .voidFeed {
        display: grid;
        gap: 4px;
        color: rgba(247, 248, 255, 0.64);
        font-size: 0.62rem;
        letter-spacing: 0.09em;
        text-align: left;
        text-transform: uppercase;
      }

      .voidFeed strong {
        color: #c9ff37;
        font-weight: 700;
      }

      .voidCountdown {
        display: grid;
        justify-items: start;
        gap: 5px;
        text-align: left;
      }

      .voidCountdown strong {
        font-size: clamp(2.5rem, 5vw, 4.5rem);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        line-height: 0.9;
      }

      .voidPage.isReturning .voidBackground {
        animation: spaceJump 0.85s ease-in forwards;
      }

      .voidPage.isReturning .voidScanlines {
        opacity: 0.5;
      }

      @keyframes spaceDrift {
        to {
          transform: scale(1.07) translate3d(-0.7%, -0.5%, 0);
        }
      }

      @keyframes textCursor {
        50% {
          opacity: 0;
        }
      }

      @keyframes spaceJump {
        to {
          filter: blur(8px);
          transform: scale(1.35);
        }
      }

      @keyframes musicBar {
        to {
          height: 12px;
        }
      }

      @media (max-width: 560px) {
        .voidMessage {
          top: 46%;
        }

        .voidFooter {
          align-items: center;
          gap: 10px;
        }

        .voidHeader {
          align-items: flex-start;
        }

        .voidHeaderActions {
          flex-direction: column;
          align-items: flex-end;
        }

        .voidCountdown span {
          max-width: 100px;
        }

        .voidFooterActions {
          display: grid;
          justify-items: start;
        }

        .voidFeed {
          display: none;
        }

        .voidCode {
          align-self: end;
          text-align: center;
        }

        .voidControl,
        .voidHome {
          min-height: 40px;
          padding-inline: 12px;
          font-size: 0.64rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .voidBackground,
        .voidTyped::after,
        .voidMusicBars i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="voidPage" id="voidPage">
      <video class="voidBackground" id="spaceVideo" poster="/assets/space/space-poster.avif" muted playsinline preload="metadata" aria-label="A continuous sequence of deep-space scenes"></video>
      <div class="voidShade" aria-hidden="true"></div>
      <div class="voidScanlines" aria-hidden="true"></div>

      <header class="voidHeader">
        <a class="voidBrand" href="/" aria-label="Aditya Patil home">AP.</a>
      </header>

      <section class="voidMessage" aria-labelledby="voidTitle">
        <p class="voidKicker">Unknown coordinates</p>
        <h1 id="voidTitle">
          <span class="voidTyped" id="voidTyped" aria-hidden="true"></span>
          <span hidden>Hello traveler, you have wandered into an unknown void.</span>
        </h1>
        <p class="voidStatus" id="voidStatus" aria-live="polite">A route to home has been located.</p>
        <div class="voidMessageActions">
          <button class="voidControl voidControlPrimary" id="stargazeButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 19 6-6"></path><path d="m14 10 5-5"></path><path d="M10 3h7l4 4-8 8-6-6Z"></path><path d="M5 19h7"></path></svg>
            <span>Keep star gazing</span>
          </button>
          <a class="voidHome" href="/">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8"></path><path d="M5 10v10h14V10"></path><path d="M9 20v-6h6v6"></path></svg>
            Return home now
          </a>
        </div>
        <div class="voidFooterActions">
          <div class="voidFeed" id="voidFeed" aria-live="polite">
            <strong>Static star field</strong>
            <span>Awaiting choice</span>
          </div>
        </div>
      </section>

      <footer class="voidFooter">
        <div class="voidCountdown" aria-label="Redirect countdown">
          <span>Returning home in</span>
          <strong id="voidNumber" aria-live="polite">10</strong>
        </div>
        <div class="voidFooterCenter">
          <button class="voidControl" id="musicButton" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l10-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="16" cy="16" r="3"></circle></svg>
            <span id="musicLabel">Play music</span>
            <span class="voidMusicBars" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
          <span class="voidCode">Error / 404</span>
        </div>
      </footer>
    </main>

    <audio id="spaceMusic" src="/assets/space/space-soundtrack.m4a" preload="none" loop></audio>

    <script>
      (() => {
        const message = "Hello traveler, you have wandered into an unknown void.";
        const videos = [
          "/assets/space/space-01.mp4",
          "/assets/space/space-02.mp4",
          "/assets/space/space-03.mp4",
          "/assets/space/space-04.mp4",
          "/assets/space/space-05.mp4",
          "/assets/space/space-06.mp4",
          "/assets/space/space-07.mp4",
          "/assets/space/space-08.mp4",
        ];
        const page = document.getElementById("voidPage");
        const typed = document.getElementById("voidTyped");
        const number = document.getElementById("voidNumber");
        const status = document.getElementById("voidStatus");
        const countdownLabel = document.querySelector(".voidCountdown span");
        const stargazeButton = document.getElementById("stargazeButton");
        const spaceVideo = document.getElementById("spaceVideo");
        const spaceMusic = document.getElementById("spaceMusic");
        const musicButton = document.getElementById("musicButton");
        const musicLabel = document.getElementById("musicLabel");
        const feed = document.getElementById("voidFeed");
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let remaining = 10;
        let character = 0;
        let redirectTimer = 0;
        let videoIndex = 0;
        let stargazing = false;

        number.textContent = String(remaining).padStart(2, "0");

        if (reducedMotion) {
          typed.textContent = message;
        } else {
          const typeTimer = window.setInterval(() => {
            character += 1;
            typed.textContent = message.slice(0, character);

            if (character >= message.length) {
              window.clearInterval(typeTimer);
            }
          }, 55);
        }

        const countdownTimer = window.setInterval(() => {
          remaining -= 1;
          number.textContent = String(remaining).padStart(2, "0");

          if (remaining === 0) {
            window.clearInterval(countdownTimer);
            page.classList.add("isReturning");
            status.textContent = "Returning home...";
            stargazeButton.disabled = true;
            redirectTimer = window.setTimeout(() => window.location.replace("/"), reducedMotion ? 0 : 800);
          }
        }, 1000);

        const updateFeed = () => {
          feed.innerHTML = `<strong>Space feed active</strong><span>Sequence ${String(videoIndex + 1).padStart(2, "0")} / ${String(videos.length).padStart(2, "0")} · Looping</span>`;
        };

        const playVideo = (index) => {
          videoIndex = index;
          updateFeed();
          spaceVideo.classList.add("isChanging");

          window.setTimeout(() => {
            spaceVideo.src = videos[videoIndex];
            spaceVideo.load();
            void spaceVideo.play().catch(() => {
              status.textContent = "Select Keep star gazing again to continue the space sequence.";
            });
          }, reducedMotion ? 0 : 220);
        };

        spaceVideo.addEventListener("playing", () => {
          spaceVideo.classList.remove("isChanging");
        });

        spaceVideo.addEventListener("ended", () => {
          if (!stargazing) return;
          playVideo((videoIndex + 1) % videos.length);
        });

        stargazeButton.addEventListener("click", () => {
          if (stargazing) return;
          stargazing = true;
          window.clearInterval(countdownTimer);
          window.clearTimeout(redirectTimer);
          page.classList.remove("isReturning");
          page.classList.add("isStargazing");
          number.textContent = "∞";
          countdownLabel.textContent = "Redirect paused";
          status.textContent = "Navigation suspended. The space sequence will continue until you choose to return.";
          stargazeButton.disabled = true;
          stargazeButton.querySelector("span").textContent = "Star gazing";
          playVideo(0);
        });

        spaceMusic.volume = 0.42;
        musicButton.addEventListener("click", () => {
          if (spaceMusic.paused) {
            void spaceMusic.play().then(() => {
              musicButton.classList.add("isPlaying");
              musicButton.setAttribute("aria-pressed", "true");
              musicLabel.textContent = "Pause music";
            }).catch(() => {
              status.textContent = "Music could not start in this browser.";
            });
          } else {
            spaceMusic.pause();
            musicButton.classList.remove("isPlaying");
            musicButton.setAttribute("aria-pressed", "false");
            musicLabel.textContent = "Play music";
          }
        });
      })();
    </script>
  </body>
</html>
